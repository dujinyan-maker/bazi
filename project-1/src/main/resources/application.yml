spring:
  application:
    name: project-1
  datasource:
    url: jdbc:mysql://localhost:3306/first?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis Configuration (optional)
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.project1.pojo.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

