spring:
  application:
    name: project-1
  datasource:
    url: jdbc:mysql://localhost:3306/first?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver


# MyBatis Configuration (optional)
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.project1.pojo.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

# 百炼千帆（通义千问）配置
dashscope:
  api-key: sk-cd08bb79967d46afbe04113ff567018e  # 请替换为你的百炼千帆API Key（从百炼控制台获取）
  # 模型配置
  model:
    # 可选模型：
    # qwen-turbo - 快速响应，适合对话场景
    # qwen-plus - 平衡性能和效果
    # qwen-max - 最强性能，适合复杂任务
    # qwen-max-longcontext - 支持长上下文
    name: qwen-flash
  # API地址（通常不需要修改）
  api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions



# 微信小程序配置
wechat:
  miniapp:
    appid: wx79a2134d3a376761  # 请替换为你的小程序AppID
    secret: b2207b3e7ab8fdc96a331aa79470e6c0  # 请替换为你的小程序AppSecret
  # 测试模式：true-允许使用测试数据跳过微信API调用，false-必须使用真实微信API
  test-mode: true

# JWT配置
jwt:
  secret: your-jwt-secret-key-minimum-256-bits-change-this-in-production  # JWT密钥，生产环境请修改
  expiration: 86400000  # Token过期时间（毫秒），默认24小时

