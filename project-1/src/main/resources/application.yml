spring:
  application:
    name: project-1
  datasource:
    url: jdbc:mysql://localhost:3306/first?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis Configuration (optional)
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.project1.pojo.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

# AI助手配置
ai:
  api:
    url: https://api.coze.cn/v3/chat  # AI API地址
    key: pat_3MK5jR0w4G2MvyuXQoxLkfrOXqGAw4xcL1vxXK2PDINyKqDgR8ltLXY1wNKNnydI # 请替换为你的API Key
  bot:
    id: 7589576869326979106  # 请替换为你的机器人ID
  # 轮询配置
  polling:
    max-attempts: 30  # 最大轮询次数
    interval: 2000    # 轮询间隔（毫秒）

# 微信小程序配置
wechat:
  miniapp:
    appid: wx79a2134d3a376761  # 请替换为你的小程序AppID
    secret: b2207b3e7ab8fdc96a331aa79470e6c0  # 请替换为你的小程序AppSecret
  # 测试模式：true-允许使用测试数据跳过微信API调用，false-必须使用真实微信API
  test-mode: true

# JWT配置
jwt:
  secret: your-jwt-secret-key-minimum-256-bits-change-this-in-production  # JWT密钥，生产环境请修改
  expiration: 86400000  # Token过期时间（毫秒），默认24小时

