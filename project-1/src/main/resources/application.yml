spring:
  application:
    name: project-1
  datasource:
    url: jdbc:mysql://localhost:3306/first?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis Configuration (optional)
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.project1.pojo.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

# 扣子AI配置
coze:
  api:
    # 扣子AI开放平台API地址
    url:  https://api.coze.cn/v3/chat
    key: pat_3MK5jR0w4G2MvyuXQoxLkfrOXqGAw4xcL1vxXK2PDINyKqDgR8ltLXY1wNKNnydI  # 扣子AI API Key
  bot:
    id: 7589576869326979106 # 请替换为你的机器人ID
  # 请求格式类型: messages, chat, query, chat_simple
  # query: 最简单的格式，只包含query字段
  # chat_simple: 简化的chat格式，只包含content
  # chat: 完整的chat格式，包含role和content_type
  # messages: 类似OpenAI的messages格式
  request-format: query
  # 轮询配置
  polling:
    max-attempts: 30  # 最大轮询次数
    interval: 1000    # 轮询间隔（毫秒）