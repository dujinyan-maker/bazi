spring:
  application:
    name: project-1
  datasource:
    url: jdbc:mysql://localhost:3306/first?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis配置
  data:
    redis:
      host: localhost  # Redis服务器地址
      port: 6379  # Redis服务器端口
      password:  # Redis密码（如果有）
      database: 0  # 使用的数据库索引（0-15）
      timeout: 5000  # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8  # 连接池最大连接数
          max-idle: 8  # 连接池最大空闲连接数
          min-idle: 0  # 连接池最小空闲连接数

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.project1.pojo.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志（开发环境，生产环境可移除）
  global-config:
    db-config:
      id-type: auto  # 主键策略：auto-自增
      table-underline: true  # 表名下划线命名
  # 关闭 MyBatis-Plus 的 banner
  banner: false

server:
  port: 8081
  address: 0.0.0.0
  # SSL/HTTPS 配置（使用 WSS 协议）
  # 需要先生成证书：运行 generate-ssl-cert.bat（Windows）或 generate-ssl-cert.sh（Linux/Mac）
  # 证书文件位置：src/main/resources/ssl/keystore.p12
  ssl:
    enabled: true  # 启用 SSL，使用 HTTPS/WSS
    key-store: classpath:ssl/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: project1
    key-password: changeit
  # HTTP 自动重定向到 HTTPS（可选，需要配置 HttpsRedirectConfig）
  # http:
  #   port: 8080

# 百炼千帆（通义千问）配置
dashscope:
  api-key: sk-cd08bb79967d46afbe04113ff567018e  # 请替换为你的百炼千帆API Key（从百炼控制台获取）
  # 模型配置
  model:
    # 可选模型：
    # qwen-turbo - 快速响应，适合对话场景
    # qwen-plus - 平衡性能和效果
    # qwen-max - 最强性能，适合复杂任务
    # qwen-max-longcontext - 支持长上下文
    name: qwen-flash
  # API地址（通常不需要修改）
  api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  # 对话历史配置
  conversation:
    max-history: 50  # 最大历史记录条数
    stream-timeout: 120000  # 流式输出超时时间（毫秒），默认2分钟
    error-timeout: 30000  # 错误响应超时时间（毫秒），默认30秒



# 微信小程序配置
wechat:
  miniapp:
    appid: wxe09e5a7bd0d70ac9  # 请替换为你的小程序AppID
    secret: f622aeaa30b0e6401b6034fe45a860d1  # 请替换为你的小程序AppSecret
  # 测试模式：true-允许使用测试数据跳过微信API调用，false-必须使用真实微信API
  test-mode: true

# JWT配置
jwt:
  secret: your-jwt-secret-key-minimum-256-bits-change-this-in-production  # JWT密钥，生产环境请修改
  expiration: 864000000  # Token过期时间（毫秒），默认24小时*10

# 短信验证码配置
sms:
  # 测试模式：true-不实际发送短信，只打印日志；false-调用真实短信服务
  test-mode: true
  # 验证码配置
  code:
    expire-minutes: 5  # 验证码有效期（分钟）
    send-interval-seconds: 60  # 发送间隔（秒），防止频繁发送

# 图片模板配置
image:
  template:
    base-path: ./templates  # 模板文件存储的基础路径（相对于项目根目录）
    default-font-name: Microsoft YaHei  # 默认字体名称
    default-font-size: 32  # 默认字体大小

# 祝福语/弹幕配置
blessing:
  message:
    max-length: 200  # 祝福语最大长度（字符）
    default-limit: 50  # 默认查询数量

# 跨域配置
cors:
  # 允许的跨域源（多个用逗号分隔，例如：http://localhost:3000,http://localhost:8080）
  # 如果为空或注释掉，则允许所有源（开发环境使用，生产环境建议指定具体域名）
  allowed-origins: 
  # 是否允许携带凭证（Cookie、Authorization等）
  allow-credentials: true
  # 预检请求的缓存时间（秒），默认1小时
  max-age: 3600

